name: Update work log

on:
  push:
    branches: [main]

# Required so the workflow can push the regenerated log.md back to main.
permissions:
  contents: write

concurrency:
  group: update-log-main
  cancel-in-progress: false

jobs:
  update-log:
    # Ignore pushes made by the bot itself, so an infinite loop never occurs.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate log.md
        run: python generate_log.py

      - name: Commit and push log.md
        run: |
          git add log.md
          if git diff --cached --quiet; then
            echo "log.md is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[skip ci] Update work log"
            git pull --rebase origin main
            git push origin main
          fi